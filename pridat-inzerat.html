<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Přidat inzerát | Bazoš – demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<header>
    <div class="icon orange-icon">
        <a href="index.html"><img src="img/kupitologo_300x125.png" alt="Logo"></a>
    </div>

    <div class="menu" id="headerMenu">
        <a href="oblibene.html">Oblíbené inzeráty</a>
        <a href="moje-inzeraty.html">Moje inzeráty</a>
        <a href="pridat-inzerat.html" style="color: #ff7b00; font-weight: 700;">Přidat inzerát</a>
    </div>
</header>

<div class="content-page">
    <a href="index.html" class="back-link">← Zpět na hlavní stranu</a>
    <h2>Nový inzerát</h2>
    
    <form action="#" method="get" id="addForm">
        <div class="form-group">
            <label>Kategorie:</label>
            <select id="addCat" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Inter', sans-serif;">
                <option value="Zvířata">Zvířata</option>
                <option value="Děti">Děti</option>
                <option value="Oblečení">Oblečení</option>
                <option value="Nábytek">Nábytek</option>
                <option value="Auto">Auto</option>
                <option value="Mobily">Mobily</option>
                <option value="Počítače">Počítače</option>
                <option value="Sport">Sport</option>
                <option value="Nemovitosti">Nemovitosti</option>
                <option value="Ostatní">Ostatní</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Nadpis inzerátu:</label>
            <input type="text" id="addTitle" placeholder="Např. Prodám horské kolo" required>
        </div>
        
        <div class="form-group">
            <label>Popis:</label>
            <textarea id="addDesc" rows="5" placeholder="Detailní popis..." required></textarea>
        </div>
        
        <div class="form-group">
            <label>Cena (Kč):</label>
            <input type="number" id="addPrice" placeholder="Např. 5000" required>
        </div>

        <div class="form-group">
            <label>Lokalita (Město):</label>
            <input type="text" id="addLoc" placeholder="Např. Praha" required>
        </div>

        <div class="form-group">
            <label>Nahrát obrázek (volitelné):</label>
            <input type="file" id="addImg" accept="image/*" style="background: white; padding: 10px;">
        </div>
        
        <button type="submit" class="btn-primary">Přidat inzerát</button>
    </form>
</div>

<footer>
    <p>&copy; 2026 Bazoš Demo - Všechna práva vyhrazena.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
