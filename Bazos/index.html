<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Bazoš – demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<div class="icon orange-icon">
    <img src="img/kupitologo_300x125.png">
</div>

    <div class="menu">
        <a href="oblibene.html">Oblíbené inzeráty</a>
        <a href="moje-inzeraty.html">Moje inzeráty</a>
        <a href="pridat-inzerat.html">Přidat inzerát</a>
    </div>
</header>

<div class="search">
    <label>Co:</label>
    <input type="text" id="searchInputWhat" placeholder="Např. Kolo">

    <label>Lokalita:</label>
    <input type="text" id="searchInputWhere" placeholder="PSČ nebo Město">

    <label>Vzdálenost:</label>
    <select id="searchInputDistance">
        <option value="">Celá ČR</option>
        <option value="10">+ 10 km</option>
        <option value="30">+ 30 km</option>
        <option value="50">+ 50 km</option>
        <option value="100">+ 100 km</option>
    </select>
    
    <label>Cena od:</label>
    <input type="number" id="searchInputPriceFrom" placeholder="Kč" style="width: 100px;">
    
    <label>do:</label>
    <input type="number" id="searchInputPriceTo" placeholder="Kč" style="width: 100px;">

    <button id="searchBtn">Hledat</button>
</div>

<div class="categories">
<div class="category" data-name="Zvířata">
    <h3>Zvířata</h3>
    <p>Psi, Kočky…</p>
</div>

<div class="category" data-name="Děti">
    <h3>Děti</h3>
    <p>Kočárky, Hračky…</p>
</div>

<div class="category" data-name="Oblečení">
    <h3>Oblečení</h3>
    <p>Kalhoty, Mikiny…</p>
</div>

<div class="category" data-name="Nábytek">
    <h3>Nábytek</h3>
    <p>Gauč, Židle…</p>
</div>

<div class="category" data-name="Auto">
    <h3>Auto</h3>
    <p>Osobní, Díly…</p>
</div>

<div class="category" data-name="Mobily">
    <h3>Mobily</h3>
    <p>Apple, Samsung…</p>
</div>

<div class="category" data-name="Počítače">
    <h3>Počítače</h3>
    <p>Notebooky, PC…</p>
</div>

<div class="category" data-name="Ostatní">
    <h3>Ostatní</h3>
    <p>Vše ostatní…</p>
</div>


</div>

<script src="script.js"></script>
</body>
</html>
