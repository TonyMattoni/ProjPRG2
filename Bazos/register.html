<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Registrace | Bazoš – demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<header>
    <div class="icon orange-icon">
        <a href="index.html"><img src="img/kupitologo_300x125.png" alt="Logo"></a>
    </div>
    <div class="menu" id="headerMenu">
        <a href="login.html">Přihlásit</a>
        <a href="register.html" style="color: #ff7b00; font-weight: 700;">Registrovat</a>
        <a href="pridat-inzerat.html">Přidat inzerát</a>
    </div>
</header>

<div class="content-page" style="max-width: 400px;">
    <h2>Registrace</h2>
    <form id="registerForm">
        <div class="form-group">
            <label>Jméno:</label>
            <input type="text" id="regName" required placeholder="Vaše jméno">
        </div>
        <div class="form-group">
            <label>E-mail:</label>
            <input type="email" id="regEmail" required placeholder="Váš e-mail">
        </div>
        <div class="form-group">
            <label>Heslo:</label>
            <input type="password" id="regPassword" required placeholder="Zvolte heslo">
        </div>
        <p id="regError" style="color: red; display: none;">Uživatel s tímto e-mailem již existuje.</p>
        <button type="submit" class="btn-primary" style="width: 100%;">Zaregistrovat</button>
    </form>
    <p style="text-align: center; margin-top: 15px;">Již máte účet? <a href="login.html">Přihlaste se</a></p>
</div>

<footer>
    <p>&copy; 2026 Bazoš Demo - Všechna práva vyhrazena.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
